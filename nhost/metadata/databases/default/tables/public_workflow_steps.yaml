table:
  name: workflow_steps
  schema: public
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
array_relationships:
  - name: step_runs
    using:
      foreign_key_constraint_on:
        column: workflow_step_id
        table:
          name: step_runs
          schema: public
insert_permissions:
  - role: editor
    permission:
      check:
        _and:
          - workflow:
              organization:
                org_members:
                  user_id:
                    _eq: X-Hasura-User-Id
          - type:
              _nin:
                - db_write
                - notify
      columns:
        - step_order
        - config
        - type
        - id
        - workflow_id
    comment: ""
  - role: owner
    permission:
      check:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
      columns:
        - step_order
        - config
        - type
        - id
        - workflow_id
    comment: ""
select_permissions:
  - role: editor
    permission:
      columns:
        - step_order
        - config
        - type
        - id
        - workflow_id
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
    comment: ""
  - role: owner
    permission:
      columns:
        - step_order
        - config
        - type
        - id
        - workflow_id
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
    comment: ""
  - role: viewer
    permission:
      columns:
        - step_order
        - config
        - type
        - id
        - workflow_id
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
    comment: ""
update_permissions:
  - role: editor
    permission:
      columns:
        - step_order
        - config
        - type
        - id
        - workflow_id
      filter:
        _and:
          - workflow:
              organization:
                org_members:
                  user_id:
                    _eq: X-Hasura-User-Id
          - type:
              _nin:
                - db_write
                - notify
      check: null
    comment: ""
  - role: owner
    permission:
      columns:
        - step_order
        - config
        - type
        - id
        - workflow_id
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
      check: null
    comment: ""
delete_permissions:
  - role: owner
    permission:
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
    comment: ""
