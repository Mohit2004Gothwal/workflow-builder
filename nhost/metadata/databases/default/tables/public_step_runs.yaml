table:
  name: step_runs
  schema: public
object_relationships:
  - name: workflow_run
    using:
      foreign_key_constraint_on: workflow_run_id
  - name: workflow_step
    using:
      foreign_key_constraint_on: workflow_step_id
insert_permissions:
  - role: user
    permission:
      check:
        _and:
          - workflow_run:
              organization:
                org_members:
                  user_id:
                    _eq: X-Hasura-User-Id
          - workflow_run:
              organization:
                org_members:
                  role:
                    _in:
                      - owner
                      - editor
      columns:
        - attempt
        - input
        - output
        - error
        - status
        - approved_at
        - finished_at
        - started_at
        - approved_by
        - id
        - workflow_run_id
        - workflow_step_id
    comment: ""
select_permissions:
  - role: editor
    permission:
      columns:
        - attempt
        - input
        - output
        - error
        - status
        - approved_at
        - finished_at
        - started_at
        - approved_by
        - id
        - workflow_run_id
        - workflow_step_id
      filter:
        workflow_run:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
    comment: ""
  - role: owner
    permission:
      columns:
        - attempt
        - input
        - output
        - error
        - status
        - approved_at
        - finished_at
        - started_at
        - approved_by
        - id
