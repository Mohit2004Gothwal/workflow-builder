table:
  name: organizations
  schema: public
array_relationships:
  - name: org_members
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          name: org_members
          schema: public
  - name: workflow_runs
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          name: workflow_runs
          schema: public
  - name: workflows
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          name: workflows
          schema: public
insert_permissions:
  - role: user
    permission:
      check:
        _and:
          - workflows:
              organization:
                org_members:
                  user_id:
                    _eq: X-Hasura-User-Id
          - workflows:
              organization:
                org_members:
                  role:
                    _in:
                      - owner
                      - editor
      columns:
        - quota_period_start
        - quota_limit
        - quota_used
        - name
        - created_at
        - id
    comment: ""
select_permissions:
  - role: editor
    permission:
      columns:
        - quota_period_start
        - quota_limit
        - quota_used
        - name
        - created_at
        - id
      filter:
        org_members:
          user_id:
            _eq: X-Hasura-User-Id
    comment: ""
  - role: owner
    permission:
      columns:
        - quota_period_start
        - quota_limit
        - quota_used
        - name
        - created_at
        - id
      filter:
        org_members:
          user_id:
            _eq: X-Hasura-User-Id
    comment: ""
  - role: user
    permission:
      columns:
        - quota_period_start
        - quota_limit
        - quota_used
        - name
        - created_at
        - id
      filter:
        workflows:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
    comment: ""
  - role: viewer
    permission:
      columns:
        - quota_period_start
        - quota_limit
        - quota_used
        - name
        - created_at
        - id
      filter:
        org_members:
          user_id:
            _eq: X-Hasura-User-Id
    comment: ""
update_permissions:
  - role: user
    permission:
      columns:
        - quota_period_start
        - quota_limit
        - quota_used
        - name
        - created_at
        - id
      filter:
        _and:
          - workflows:
              organization:
                org_members:
                  user_id:
                    _eq: X-Hasura-User-Id
          - workflows:
              organization:
                org_members:
                  role:
                    _in:
                      - owner
                      - editor
      check: null
    comment: ""
delete_permissions:
  - role: user
    permission:
      filter:
        _and:
          - workflows:
              organization:
                org_members:
                  user_id:
                    _eq: X-Hasura-User-Id
          - workflows:
              organization:
                org_members:
                  role:
                    _in:
                      - owner
    comment: ""
