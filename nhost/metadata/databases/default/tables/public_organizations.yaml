table:
  name: organizations
  schema: public
array_relationships:
  - name: org_members
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          name: org_members
          schema: public
  - name: workflow_runs
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          name: workflow_runs
          schema: public
  - name: workflows
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          name: workflows
          schema: public
select_permissions:
  - role: editor
    permission:
      columns:
        - quota_period_start
        - quota_limit
        - quota_used
        - name
        - created_at
        - id
      filter:
        org_members:
          user_id:
            _eq: X-Hasura-User-Id
    comment: ""
  - role: owner
    permission:
      columns:
        - quota_period_start
        - quota_limit
        - quota_used
        - name
        - created_at
        - id
      filter:
        org_members:
          user_id:
            _eq: X-Hasura-User-Id
    comment: ""
  - role: viewer
    permission:
      columns:
        - quota_period_start
        - quota_limit
        - quota_used
        - name
        - created_at
        - id
      filter:
        org_members:
          user_id:
            _eq: X-Hasura-User-Id
    comment: ""
