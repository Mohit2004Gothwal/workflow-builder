table:
  name: workflows
  schema: public
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
array_relationships:
  - name: workflow_runs
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          name: workflow_runs
          schema: public
  - name: workflow_steps
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          name: workflow_steps
          schema: public
  - name: workflow_triggers
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          name: workflow_triggers
          schema: public
insert_permissions:
  - role: editor
    permission:
      check:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
      columns:
        - name
        - created_at
        - created_by
        - id
        - org_id
    comment: ""
  - role: owner
    permission:
      check:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
      columns:
        - name
        - created_at
        - created_by
        - id
        - org_id
    comment: ""
  - role: user
    permission:
      check:
        _and:
          - organization:
              org_members:
                user_id:
                  _eq: X-Hasura-User-Id
          - organization:
              org_members:
                role:
                  _in:
                    - owner
                    - editor
      columns:
        - name
        - created_at
        - created_by
        - id
        - org_id
    comment: ""
select_permissions:
  - role: editor
    permission:
      columns:
        - name
        - created_at
        - created_by
        - id
        - org_id
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
    comment: ""
  - role: owner
    permission:
      columns:
        - name
        - created_at
        - created_by
        - id
        - org_id
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
    comment: ""
  - role: user
    permission:
      columns:
        - name
        - created_at
        - created_by
        - id
        - org_id
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
    comment: ""
  - role: viewer
    permission:
      columns:
        - name
        - created_at
        - created_by
        - id
        - org_id
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
    comment: ""
update_permissions:
  - role: editor
    permission:
      columns:
        - name
        - created_at
        - created_by
        - id
        - org_id
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
      check: null
    comment: ""
  - role: owner
    permission:
      columns:
        - name
        - created_at
        - created_by
        - id
        - org_id
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
      check: null
    comment: ""
  - role: user
    permission:
      columns:
        - name
        - created_at
        - created_by
        - id
        - org_id
      filter:
        _and:
          - organization:
              org_members:
                user_id:
                  _eq: X-Hasura-User-Id
          - organization:
              org_members:
                role:
                  _in:
                    - owner
                    - editor
      check: null
    comment: ""
delete_permissions:
  - role: owner
    permission:
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
    comment: ""
  - role: user
    permission:
      filter:
        _and:
          - organization:
              org_members:
                user_id:
                  _eq: X-Hasura-User-Id
          - organization:
              org_members:
                role:
                  _in:
                    - owner
    comment: ""
