table:
  name: workflow_runs
  schema: public
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
array_relationships:
  - name: step_runs
    using:
      foreign_key_constraint_on:
        column: workflow_run_id
        table:
          name: step_runs
          schema: public
insert_permissions:
  - role: user
    permission:
      check:
        _and:
          - organization:
              org_members:
                user_id:
                  _eq: X-Hasura-User-Id
          - organization:
              org_members:
                role:
                  _in:
                    - owner
                    - editor
      columns:
        - status
        - trigger_type
        - finished_at
        - started_at
        - id
        - org_id
        - started_by
        - workflow_id
    comment: ""
select_permissions:
  - role: editor
    permission:
      columns:
        - status
        - trigger_type
        - finished_at
        - started_at
        - id
        - org_id
        - started_by
        - workflow_id
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
    comment: ""
  - role: owner
    permission:
      columns:
        - status
        - trigger_type
        - finished_at
        - started_at
        - id
        - org_id
        - started_by
        - workflow_id
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
    comment: ""
  - role: user
    permission:
      columns:
        - status
        - trigger_type
        - finished_at
        - started_at
        - id
        - org_id
        - started_by
        - workflow_id
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
    comment: ""
  - role: viewer
    permission:
      columns:
        - status
        - trigger_type
        - finished_at
        - started_at
        - id
        - org_id
        - started_by
        - workflow_id
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
    comment: ""
update_permissions:
  - role: user
    permission:
      columns:
        - status
        - trigger_type
        - finished_at
        - started_at
        - id
        - org_id
        - started_by
        - workflow_id
      filter:
        _and:
          - organization:
              org_members:
                user_id:
                  _eq: X-Hasura-User-Id
          - organization:
              org_members:
                role:
                  _in:
                    - owner
                    - editor
      check: null
    comment: ""
delete_permissions:
  - role: user
    permission:
      filter:
        _and:
          - organization:
              org_members:
                user_id:
                  _eq: X-Hasura-User-Id
          - organization:
              org_members:
                role:
                  _in:
                    - owner
    comment: ""
