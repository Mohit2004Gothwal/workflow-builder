table:
  name: org_members
  schema: public
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
insert_permissions:
  - role: owner
    permission:
      check:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
      columns:
        - role
        - created_at
        - id
        - org_id
        - user_id
    comment: ""
  - role: user
    permission:
      check:
        _and:
          - organization:
              org_members:
                user_id:
                  _eq: X-Hasura-User-Id
          - organization:
              org_members:
                role:
                  _in:
                    - owner
                    - editor
      columns:
        - role
        - created_at
        - id
        - org_id
        - user_id
    comment: ""
select_permissions:
  - role: editor
    permission:
      columns:
        - role
        - created_at
        - id
        - org_id
        - user_id
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
    comment: ""
  - role: owner
