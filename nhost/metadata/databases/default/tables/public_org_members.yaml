    comment: ""
update_permissions:
  - role: owner
    permission:
      columns:
        - role
        - created_at
        - id
        - org_id
        - user_id
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
      check: null
    comment: ""
  - role: user
    permission:
      columns:
        - role
